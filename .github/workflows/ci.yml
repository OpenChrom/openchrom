name: Continuous Integration
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: maven:3.9-eclipse-temurin-21

    steps:
    - name: Checkout OpenChrom
      uses: actions/checkout@v6
      with:
        path: openchrom

    - name: Build with Maven
      env:
        MAVEN_ARGS: "--batch-mode --no-transfer-progress -Dstyle.color=always"
      run: |
        cd openchrom
        mvn -f openchrom/releng/net.openchrom.aggregator/pom.xml -T 1C verify -Pci
